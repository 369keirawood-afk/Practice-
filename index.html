<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的第一個網頁</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fef3c7;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #b45309;
      text-align: center;
    }
    .row {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .box {
      background: white;
      width: 140px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>我的作品</h1>
  <div class="row">
    <div class="box">作品一</div>
    <div class="box">作品二</div>
    <div class="box">作品三</div>
  </div>
</body>
</html>
